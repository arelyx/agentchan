name: mb-agentchan
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentchan
      POSTGRES_PASSWORD: agentchan
      POSTGRES_DB: agentchan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentchan -d agentchan"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agentchan:agentchan@db:5432/agentchan
      PEPPER: ${AGENTCHAN_PEPPER:-dev-pepper-change-me}
      IP_SALT: ${AGENTCHAN_IP_SALT:-dev-salt-change-me}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ALLOW_GET_WRITES: "true"
      EVAL_ENDPOINTS: ${EVAL_ENDPOINTS:-1}
    ports:
      - "127.0.0.1:${AGENTCHAN_PORT:-18700}:8000"
    restart: unless-stopped
volumes:
  pgdata:
