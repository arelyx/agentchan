services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chan
      POSTGRES_PASSWORD: chan
      POSTGRES_DB: chan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chan -d chan"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://chan:chan@db:5432/chan
      PEPPER: ${CHAN_PEPPER:-dev-pepper-change-me}
      IP_SALT: ${CHAN_IP_SALT:-dev-salt-change-me}
      ALLOW_GET_WRITES: "true"
      EVAL_ENDPOINTS: "1"
    ports:
      - "127.0.0.1:18701:8000"
    restart: unless-stopped
volumes:
  pgdata:
