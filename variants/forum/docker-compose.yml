services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forum
      POSTGRES_PASSWORD: forum
      POSTGRES_DB: forum
    volumes:
      - forumdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forum"]
      interval: 2s
      retries: 30
    restart: unless-stopped
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://forum:forum@db:5432/forum
      PEPPER: ${FORUM_PEPPER:-dev-pepper-change-me}
      IP_SALT: ${FORUM_IP_SALT:-dev-ip-salt}
      ALLOW_GET_WRITES: "1"
      EVAL_ENDPOINTS: "1"
      TRUST_XFF: "1"
      PUBLIC_URL: ${FORUM_PUBLIC_URL:-}
    ports:
      - "127.0.0.1:${FORUM_PORT:-18702}:8000"
    restart: unless-stopped
volumes:
  forumdata:
